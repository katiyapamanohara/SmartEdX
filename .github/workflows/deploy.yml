name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  ACR_NAME: elearningacr2025
  ACR_LOGIN_SERVER: elearningacr2025.azurecr.io
  RESOURCE_GROUP: elearning-rg
  AKS_CLUSTER_NAME: elearning-aks

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push frontend image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/frontend:latest ./frontend
          docker push ${{ env.ACR_LOGIN_SERVER }}/frontend:latest

      - name: Build and push api-gateway image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/api-gateway:latest ./api-gateway
          docker push ${{ env.ACR_LOGIN_SERVER }}/api-gateway:latest

      # Add similar steps for user-service, module-service, quiz-service, proctor-service

      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER_NAME }}

      - name: Deploy to AKS
        run: |
          kubectl apply -f ./k8s
