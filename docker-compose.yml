version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api-gateway:3001
      - NEXT_PUBLIC_WEBSOCKET_URL=ws://quiz-service:4001
    depends_on:
      - api-gateway
      # - quiz-service
    networks:
      - app-network

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/elearning
      - REDIS_URL=redis://redis:6379
      - AZURE_BLOB_CONNECTION_STRING=your-azure-blob-connection-string
    # depends_on:
      # - postgres
      # - redis
    networks:
      - app-network

