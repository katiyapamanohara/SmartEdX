<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Articom Voice Agent</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <script src="/static/js/app.js" type="module"></script>
    <script src="/static/js/sip-tester.js" type="module"></script>
  </head>

  <body>
    <header>
      <h1>Articom Voice Agent</h1>
      <div class="subtitle">
        Real-time voice interaction platform powered by Google ADK
      </div>

      <!-- Mode Tabs -->
      <div class="mode-tabs">
        <button class="tab-button active" data-mode="websocket">
          🌐 WebSocket Mode
        </button>
        <button class="tab-button" data-mode="sip">📞 SIP Test Mode</button>
      </div>

      <div class="header-options">
        <label
          class="header-checkbox"
          title="Enable model to proactively respond without explicit prompts (Native audio models only)"
        >
          <input type="checkbox" id="enableProactivity" />
          <span>Proactivity</span>
        </label>
        <label
          class="header-checkbox"
          title="Enable model to detect and adapt to emotional cues (Native audio models only)"
        >
          <input type="checkbox" id="enableAffectiveDialog" />
          <span>Affective Dialog</span>
        </label>
        <label
          class="header-select"
          title="Force the bot to respond strictly in the selected language (overrides auto-detection)"
        >
          <span>Language:</span>
          <select id="languageOverride">
            <option value="" selected disabled>Select language</option>
            <option value="English">English</option>
            <option value="Sinhala">Sinhala</option>
            <option value="Tamil">Tamil</option>
          </select>
        </label>
      </div>
      <!-- SIP Test Panel -->
      <div id="sipPanel" class="sip-panel" style="display: none">
        <div class="sip-controls">
          <h2>📞 SIP Call Simulator</h2>
          <div class="sip-config">
            <div class="config-row">
              <label>WebSocket URL:</label>
              <input type="text" id="sipUrl" value="ws://localhost:8000/sip" />
            </div>
            <div class="config-row">
              <label>Codec:</label>
              <select id="sipCodec">
                <option value="PCMU">G.711 μ-law (PCMU)</option>
                <option value="PCMA">G.711 a-law (PCMA)</option>
              </select>
            </div>
            <div class="config-row">
              <label>Caller ID:</label>
              <input type="text" id="sipCallerId" value="+15551234567" />
            </div>
            <div class="config-row">
              <label>Test Audio:</label>
              <select id="sipAudioType">
                <option value="tone">Tone (440Hz)</option>
                <option value="sweep">Frequency Sweep</option>
                <option value="mic">Microphone</option>
              </select>
            </div>
            <div class="config-row">
              <label>Duration:</label>
              <input
                type="number"
                id="sipDuration"
                value="3"
                min="1"
                max="30"
              />
              seconds
            </div>
          </div>

          <div class="sip-actions">
            <button id="sipStartCall" class="btn-primary">📞 Start Call</button>
            <button id="sipEndCall" class="btn-danger" disabled>
              ⏹ End Call
            </button>
            <button id="sipSendAudio" class="btn-secondary" disabled>
              🎵 Send Audio
            </button>
          </div>

          <div class="sip-status">
            <div class="status-item">
              <span class="label">Call State:</span>
              <span id="sipCallState" class="value">Idle</span>
            </div>
            <div class="status-item">
              <span class="label">Audio Sent:</span>
              <span id="sipAudioSent" class="value">0 bytes</span>
            </div>
            <div class="status-item">
              <span class="label">Audio Received:</span>
              <span id="sipAudioReceived" class="value">0 bytes</span>
            </div>
          </div>
        </div>

        <div class="sip-log">
          <div class="log-header">
            <h3>SIP Messages</h3>
            <button id="sipClearLog" class="btn-small">Clear</button>
          </div>
          <div id="sipLogContent" class="log-content"></div>
        </div>
      </div>

      <div class="container" id="websocketPaneln-status">
        <span class="status-indicator" id="statusIndicator"></span>
        <span id="statusText">Connecting...</span>
      </div>
    </header>

    <div class="main-layout">
      <div class="container">
        <div id="messages"></div>

        <!-- Audio Output Visualizer -->
        <div class="visualizer-container">
          <div class="visualizer-header">
            <span class="visualizer-title">🔊 Output Audio Waveform</span>
            <span class="visualizer-status" id="visualizerStatus"
              >Inactive</span
            >
          </div>
          <canvas id="waveformCanvas" class="waveform-canvas"></canvas>
        </div>

        <div class="input-container">
          <form id="messageForm">
            <div class="input-wrapper">
              <input
                type="text"
                id="message"
                name="message"
                placeholder="Type your message here..."
                autocomplete="off"
              />
              <button type="submit" id="sendButton" disabled>Send</button>
              <button type="button" id="startAudioButton">Start Audio</button>
              <button type="button" id="cameraButton">📷 Camera</button>
            </div>
          </form>
        </div>
      </div>

      <div class="console-panel">
        <div class="console-header">
          <h2>Event Console</h2>
          <div class="console-controls">
            <label class="console-checkbox">
              <input type="checkbox" id="showAudioEvents" />
              <span>Show audio</span>
            </label>
            <button id="clearConsole" class="console-clear-btn">Clear</button>
          </div>
        </div>
        <div id="consoleContent" class="console-content"></div>
      </div>
    </div>

    <!-- Camera Preview Modal -->
    <div id="cameraModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Camera Preview</h3>
          <button id="closeCameraModal" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <video id="cameraPreview" autoplay playsinline></video>
        </div>
        <div class="modal-footer">
          <button id="cancelCamera" class="btn-secondary">Cancel</button>
          <button id="captureImage" class="btn-primary">📷 Send Image</button>
        </div>
      </div>
    </div>
  </body>
</html>
