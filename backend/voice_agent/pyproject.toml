[project]
name = "voice-agent"
version = "0.1.0"
description = "Voice Agent Service - Real-time voice interaction platform"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "VoiceAgent" }
]

dependencies = [
    "google-adk>=1.26.0",
    "fastapi>=0.115.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.32.0",
    "google-genai>=1.61.0",
    "websockets>=15.0.1",
    "langfuse==3.14.1",
    "openinference-instrumentation-google-adk>=0.1.9",
    "audioop-lts>=0.2.1",
    "numpy>=1.26.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "fastembed",
    "python-json-logger>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
voice-agent = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.shared-data]
"app/static" = "share/voice-agent/static"
"app/.env" = "share/voice-agent/.env.template"

# ── Ruff ──────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",  # line too long — handled by formatter
    "E712",  # comparison to True/False
    "F841",  # local variable assigned but never used (common in WIP)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ── Pytest ────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
addopts = "-v --tb=short"

# ── Coverage ──────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["app"]
omit = ["app/__pycache__/*", "app/static/*"]

[tool.coverage.report]
fail_under = 45
show_missing = true
skip_empty = true
