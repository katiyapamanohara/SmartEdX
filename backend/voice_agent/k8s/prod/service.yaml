# ClusterIP Service for internal pod-to-pod communication
apiVersion: v1
kind: Service
metadata:
  name: voice-service-internal
  namespace: prod
  labels:
    app: voice-service
spec:
  type: ClusterIP
  selector:
    app: voice-service
    role: sip-trunk
  ports:
  - name: http
    protocol: TCP
    port: 8000
    targetPort: 8000

