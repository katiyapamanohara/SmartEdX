apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-service
  namespace: prod
  labels:
    app: voice-service
    role: sip-trunk
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  selector:
    matchLabels:
      app: voice-service
      role: sip-trunk
  
  template:
    metadata:
      labels:
        app: voice-service
        role: sip-trunk
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    
    spec:
      # No longer needed - Kamailio handles external SIP
      hostNetwork: false
      
      # Prefer spreading pods across nodes (soft rule so rolling updates work on single-node clusters)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - voice-service
              topologyKey: kubernetes.io/hostname
      
      containers:
      - name: voice-agent
        image: dpginforwavechatbotacr.azurecr.io/articom-voice-dp:v1.22.1
        imagePullPolicy: Always
        
        ports:
        - containerPort: 5060
          protocol: UDP
          name: sip-udp
        - containerPort: 8000
          protocol: TCP
          name: http
        - containerPort: 20000
          protocol: UDP
          name: rtp-udp
        # RTP media port for audio
        
        env:
        # Pod metadata
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: SIP_SERVER_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /var/secrets/google/articom-integration-2b2549f3b6f3.json
        
        volumeMounts:
          - name: gcp-articom-dev-key
            mountPath: /var/secrets/google
            readOnly: true
          - name: secrets-store
            mountPath: /mnt/secrets-store
            readOnly: true
       
        # Load configuration from ConfigMap
        envFrom:
        - configMapRef:
            name: voice-service-config
        - secretRef:
            name: articom-voice-env
            
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
            ephemeral-storage: "1Gi"
          limits:
            memory: "2Gi"
            cpu: "2000m"
            ephemeral-storage: "2Gi"
        
        readinessProbe:
          httpGet:
            path: /
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
          capabilities:
            add:
            - NET_BIND_SERVICE  # Required for binding to ports < 1024
            drop:
            - ALL
      
      volumes:
      - name: gcp-articom-dev-key
        secret:
          secretName: gcp-articom-dev-key
      - name: secrets-store
        csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: articom-voice-kv
      
      # Termination grace period for active calls
      terminationGracePeriodSeconds: 60
      
      restartPolicy: Always
