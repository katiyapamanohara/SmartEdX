apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voice-service-hpa
  namespace: prod
  labels:
    app: voice-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voice-service
  
  minReplicas: 1
  maxReplicas: 10
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes before scaling down
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60  # 1 minute before scaling up
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
  
  metrics:
  # CPU utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  
  # Memory utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
