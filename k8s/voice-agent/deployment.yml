apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-agent
  namespace: prod
  labels:
    app: voice-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voice-agent
  template:
    metadata:
      labels:
        app: voice-agent
    spec:
      containers:
        - name: voice-agent
          image: us-central1-docker.pkg.dev/lively-synapse-495509-t0/smartedx-docker-repo/voice-agent:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: sip-udp
              containerPort: 5060
              protocol: UDP
            - name: rtp-udp
              containerPort: 20000
              protocol: UDP
          envFrom:
            - secretRef:
                name: voice-agent-secret
         
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
---
# HTTP/WebSocket traffic — routed via Cloudflare Tunnel / Ingress
apiVersion: v1
kind: Service
metadata:
  name: voice-agent
  namespace: prod
  labels:
    app: voice-agent
spec:
  selector:
    app: voice-agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
# SIP + RTP traffic — must bypass Cloudflare; requires direct public IP
# GKE will provision an external L4 load balancer with a public IP for UDP
apiVersion: v1
kind: Service
metadata:
  name: voice-agent-sip
  namespace: prod
  labels:
    app: voice-agent
  annotations:
    cloud.google.com/load-balancer-type: "External"
    # Uncomment and set this once you have a reserved static IP in GCP:
    # kubernetes.io/ingress.global-static-ip-name: "voice-agent-sip-ip"
spec:
  selector:
    app: voice-agent
  ports:
    - name: sip-udp
      port: 5060
      targetPort: 5060
      protocol: UDP
    - name: rtp-udp
      port: 20000
      targetPort: 20000
      protocol: UDP
  type: LoadBalancer
  # Keep SIP sessions on the same pod; SIP re-INVITE/BYE must reach the same instance
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voice-agent-hpa
  namespace: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voice-agent
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
