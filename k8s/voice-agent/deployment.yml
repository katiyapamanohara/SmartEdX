apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-agent
  namespace: prod
  labels:
    app: voice-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voice-agent
  template:
    metadata:
      labels:
        app: voice-agent
    spec:
      containers:
        - name: voice-agent
          image: us-central1-docker.pkg.dev/lively-synapse-495509-t0/smartedx-docker-repo/voice-agent:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: voice-agent-secret
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/key.json
          volumeMounts:
            - name: gcp-key
              mountPath: /var/secrets/google
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: gcp-key
          secret:
            secretName: voice-agent-gcp-key
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: voice-agent
  namespace: prod
  labels:
    app: voice-agent
spec:
  selector:
    app: voice-agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP

