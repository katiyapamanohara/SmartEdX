apiVersion: apps/v1
kind: Deployment
metadata:
  name: facial-recognition
  namespace: prod
  labels:
    app: facial-recognition
spec:
  replicas: 1
  selector:
    matchLabels:
      app: facial-recognition
  template:
    metadata:
      labels:
        app: facial-recognition
    spec:
      containers:
        - name: facial-recognition
          image: us-central1-docker.pkg.dev/lively-synapse-495509-t0/smartedx-docker-repo/facial-recognition:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          envFrom:
            - secretRef:
                name: facial-recognition-secret
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: facial-recognition
  namespace: prod
  labels:
    app: facial-recognition
spec:
  selector:
    app: facial-recognition
  ports:
    - name: http
      port: 8002
      targetPort: 8002
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: facial-recognition-hpa
  namespace: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: facial-recognition
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
