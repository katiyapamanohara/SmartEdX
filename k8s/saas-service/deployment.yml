apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-service
  namespace: smartedx
  labels:
    app: saas-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: saas-service
  template:
    metadata:
      labels:
        app: saas-service
    spec:
      containers:
        - name: saas-service
          image: ghcr.io/smartedx-docker-repo/saas-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5002"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: saas-db-secret
                  key: host
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: saas-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: saas-db-secret
                  key: password
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: saas-db-secret
                  key: database
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: saas-app-secret
                  key: jwt-secret
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: MINIO_ENDPOINT
              value: "minio"
            - name: MINIO_PORT
              value: "9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: saas-minio-secret
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: saas-minio-secret
                  key: secret-key
            - name: MINIO_BUCKET
              value: "smartedx-bucket"
            - name: FIREBASE_SERVICE_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: saas-firebase-secret
                  key: service-account-json
            - name: CORS_ORIGIN
              value: "https://institute.smartedx.com,https://saas.smartedx.com"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5002
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5002
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: saas-service
  namespace: smartedx
  labels:
    app: saas-service
spec:
  selector:
    app: saas-service
  ports:
    - name: http
      port: 5002
      targetPort: 5002
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: saas-service-hpa
  namespace: smartedx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: saas-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
