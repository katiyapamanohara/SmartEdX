apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-service
  namespace: prod
  labels:
    app: saas-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saas-service
  template:
    metadata:
      labels:
        app: saas-service
    spec:
      containers:
        - name: saas-service
          image: us-central1-docker.pkg.dev/lively-synapse-495509-t0/smartedx-docker-repo/saas-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
          envFrom:
            - secretRef:
                name: saas-service-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5002
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5002
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: saas-service
  namespace: prod
  labels:
    app: saas-service
spec:
  selector:
    app: saas-service
  ports:
    - name: http
      port: 5002
      targetPort: 5002
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: saas-service-hpa
  namespace: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: saas-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
