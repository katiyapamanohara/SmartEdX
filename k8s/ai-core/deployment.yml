apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-core
  namespace: smartedx
  labels:
    app: ai-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-core
  template:
    metadata:
      labels:
        app: ai-core
    spec:
      containers:
        - name: ai-core
          image: ghcr.io/smartedx-docker-repo/ai-core:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            - name: AI_PROVIDER
              value: "anthropic"
            - name: MODEL_ID
              value: "claude-sonnet-4-6"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-core-secret
                  key: anthropic-api-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-core-secret
                  key: openai-api-key
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-core-secret
                  key: google-api-key
            - name: INSTITUTE_API_URL
              value: "http://institute-service:5002"
            - name: CORS_ORIGINS
              value: "https://institute.smartedx.com,https://saas.smartedx.com"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ai-core
  namespace: smartedx
  labels:
    app: ai-core
spec:
  selector:
    app: ai-core
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-core-hpa
  namespace: smartedx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-core
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
