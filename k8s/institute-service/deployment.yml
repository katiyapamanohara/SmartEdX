apiVersion: apps/v1
kind: Deployment
metadata:
  name: institute-service
  namespace: prod
  labels:
    app: institute-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: institute-service
  template:
    metadata:
      labels:
        app: institute-service
    spec:
      containers:
        - name: institute-service
          image: us-central1-docker.pkg.dev/lively-synapse-495509-t0/smartedx-docker-repo/institute-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5003
          envFrom:
            - secretRef:
                name: institute-service-secret
          # resources:
          #   requests:
          #     cpu: 100m
          #     memory: 256Mi
          #   limits:
          #     cpu: 500m
          #     memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/institutes/health
              port: 5003
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/institutes/health
              port: 5003
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: institute-service
  namespace: prod
  labels:
    app: institute-service
spec:
  selector:
    app: institute-service
  ports:
    - name: http
      port: 5003
      targetPort: 5003
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: institute-service-hpa
  namespace: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: institute-service
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
