apiVersion: apps/v1
kind: Deployment
metadata:
  name: institute-service
  namespace: prod
  labels:
    app: institute-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: institute-service
  template:
    metadata:
      labels:
        app: institute-service
    spec:
      containers:
        - name: institute-service
          image: us-central1-docker.pkg.dev/lively-synapse-495509-t0/smartedx-docker-repo/institute-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5002"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: institute-db-secret
                  key: host
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: institute-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: institute-db-secret
                  key: password
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: institute-db-secret
                  key: database
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: institute-app-secret
                  key: jwt-secret
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: CORS_ORIGIN
              value: "https://institute.smartedx.com,https://saas.smartedx.com"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/institutes/health
              port: 5002
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/institutes/health
              port: 5002
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: institute-service
  namespace: prod
  labels:
    app: institute-service
spec:
  selector:
    app: institute-service
  ports:
    - name: http
      port: 5002
      targetPort: 5002
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: institute-service-hpa
  namespace: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: institute-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
